name: Build Rohit Sharma NetHunter Kernel (POCO F7)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build NetHunter Kernel (Rohit Sharma Edition)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev git ccache curl wget zip python3 clang lld llvm \
            libarchive-tools cpio dwarves kmod rsync

      - name: Setup Toolchain (AOSP Clang r522817)
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -zxf clang-r522817.tar.gz
          rm -f clang-r522817.tar.gz
          mkdir -p $GITHUB_WORKSPACE/toolchains
          ln -sfn $GITHUB_WORKSPACE/toolchain $GITHUB_WORKSPACE/toolchains/clang

      - name: Clone NetHunter Kernel Source (konoha-kernel-gki)
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b feature/nethunter https://github.com/onyx-oss/konoha-kernel-gki.git kernel-source

      - name: Sanitize Dangerous Hooks & Exploits
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          echo "[-] Neutralizing Baseband-guard hook completely..."
          mkdir -p Baseband-guard
          cat << 'EOF' > Baseband-guard/setup.sh
          #!/bin/sh
          exit 0
          EOF
          chmod +x Baseband-guard/setup.sh
          sed -i 's|.*Baseband-guard.*setup.sh.*||g' build.sh || true

      - name: Compile NetHunter Kernel via Native build.sh
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export CLANG_PATH="$GITHUB_WORKSPACE/toolchain"
          export CLANG_DIR="$GITHUB_WORKSPACE/toolchain"

          chmod +x build.sh
          chmod +x nethunter_patch.sh 2>/dev/null || true

          ./build.sh \
            hz=250 \
            variant=root \
            root=ksu-next \
            nethunter=on \
            hardened=off \
            bypasscharging=off \
            droidspaces=off \
            lto=thin \
            kgsl_exploit=off \
            wifi_exploit=off \
            data_exploit=off \
            kernel_name="-NetHunter-Rohit-Edition"

      - name: Build Out-Of-Tree RTL8821AU Driver (Archer T2U Plus)
        run: |
          cd $GITHUB_WORKSPACE
          echo "[-] Cloning morrownr/8821au-20210708 for Archer T2U Plus..."
          git clone --depth=1 https://github.com/morrownr/8821au-20210708.git rtl8821au || true
          if [ -d "rtl8821au" ]; then
            export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
            make -C $GITHUB_WORKSPACE/kernel-source \
              O=$GITHUB_WORKSPACE/kernel-source/out \
              M=$GITHUB_WORKSPACE/rtl8821au \
              ARCH=arm64 \
              CC=clang \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              LLVM=1 \
              LLVM_IAS=1 \
              USER_EXTRA_CFLAGS="-Wno-error" \
              modules -j$(nproc) || true
          fi

      - name: Package AnyKernel3 - Rohit Sharma NetHunter Edition
        run: |
          cd $GITHUB_WORKSPACE
          BUILT_ZIP="${ZIP_PATH:-$(find $GITHUB_WORKSPACE/kernel-source -maxdepth 1 -name '*.zip' | head -n 1)}"
          echo "Built ZIP: $BUILT_ZIP"
          if [ -z "$BUILT_ZIP" ] || [ ! -f "$BUILT_ZIP" ]; then
            echo "[-] Error: Built kernel zip not found!"
            exit 1
          fi

          mkdir -p repack
          cd repack
          unzip -q "$BUILT_ZIP"

          # Harvest built wireless modules
          mkdir -p modules
          find "$GITHUB_WORKSPACE/kernel-source/out" -name "*.ko" -exec cp -v {} modules/ \; 2>/dev/null || true
          find "$GITHUB_WORKSPACE/rtl8821au" -name "*.ko" -exec cp -v {} modules/ \; 2>/dev/null || true
          $GITHUB_WORKSPACE/toolchain/bin/llvm-strip --strip-debug modules/*.ko 2>/dev/null || true

          # Download and bundle required WiFi Firmware
          mkdir -p firmware/rtlwifi
          wget -q -O firmware/rtlwifi/rtl8188eufw.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtlwifi/rtl8188eufw.bin || true
          wget -q -O firmware/htc_9271.fw https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/htc_9271.fw || true

          # Generate clean anykernel.sh for POCO F7
          python3 -c '
          content = """### AnyKernel3 - Rohit Sharma NetHunter Edition
          properties() { \'
          kernel.string=Kali NetHunter Kernel - Rohit Sharma Edition (POCO F7 / Onyx)
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          \'; }

          # Boot shell variables
          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          no_magisk_check=1;

          # Shell Attributes
          . tools/ak3-core.sh;

          ui_print " ";
          ui_print "===========================================";
          ui_print "  KALI NETHUNTER KERNEL - ROHIT SHARMA     ";
          ui_print "  Device: POCO F7 / Onyx (SM8735)          ";
          ui_print "  Features: Packet Injection + HID + WiFi  ";
          ui_print "  Universal GKI: Android 15 / 16 / 17      ";
          ui_print "===========================================";
          ui_print " ";

          # GKI Boot Install (POCO F7 has init_boot for ramdisk, boot for kernel)
          if [ -L "/dev/block/bootdevice/by-name/init_boot_a" -o -L "/dev/block/by-name/init_boot_a" -o -e "/dev/block/by-name/init_boot_a" -o -e "/dev/block/by-name/init_boot" ]; then
              split_boot;
              flash_boot;
          else
              dump_boot;
              write_boot;
          fi

          # Deploy NetHunter WiFi Drivers & Firmwares
          ui_print "- Deploying NetHunter WiFi drivers and firmwares...";
          mkdir -p /data/adb/modules/nethunter_wifi/system/lib/modules 2>/dev/null || true
          mkdir -p /data/adb/modules/nethunter_wifi/system/etc/firmware/rtlwifi 2>/dev/null || true
          mkdir -p /sdcard/NetHunter-Drivers/modules 2>/dev/null || true
          mkdir -p /sdcard/NetHunter-Drivers/firmware/rtlwifi 2>/dev/null || true

          if [ -d "$home/modules" ]; then
            cp -rf $home/modules/* /data/adb/modules/nethunter_wifi/system/lib/modules/ 2>/dev/null || true
            cp -rf $home/modules/* /sdcard/NetHunter-Drivers/modules/ 2>/dev/null || true
          fi

          if [ -d "$home/firmware" ]; then
            cp -rf $home/firmware/rtlwifi/* /data/adb/modules/nethunter_wifi/system/etc/firmware/rtlwifi/ 2>/dev/null || true
            cp -rf $home/firmware/* /data/adb/modules/nethunter_wifi/system/etc/firmware/ 2>/dev/null || true
            cp -rf $home/firmware/* /sdcard/NetHunter-Drivers/firmware/ 2>/dev/null || true
          fi

          ui_print " ";
          ui_print "-> NetHunter Kernel Successfully Installed!";
          ui_print "-> Flash Complete by Rohit Sharma!";
          """
          # Strip leading indentation from each line
          clean_lines = [line.strip() for line in content.splitlines()]
          with open("anykernel.sh", "w") as f:
              f.write("\n".join(clean_lines) + "\n")
          '

          FINAL_ZIP="NetHunter-Kernel-POCO-F7-Onyx-Rohit-Edition.zip"
          zip -r9 "$FINAL_ZIP" * -x "*.zip"
          mv "$FINAL_ZIP" $GITHUB_WORKSPACE/

      - name: Upload Flashable NetHunter Kernel Release
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-POCO-F7-Onyx-Rohit-Edition
          path: ${{ github.workspace }}/NetHunter-Kernel-POCO-F7-Onyx-Rohit-Edition.zip
          retention-days: 14
