name: Build Rohit Sharma NetHunter Kernel (POCO F7)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build NetHunter Kernel (Rohit Sharma Edition)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev git ccache curl wget zip python3 clang lld llvm \
            libarchive-tools cpio dwarves kmod rsync

      - name: Setup Toolchain (AOSP Clang r522817)
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -zxf clang-r522817.tar.gz
          rm -f clang-r522817.tar.gz
          mkdir -p $GITHUB_WORKSPACE/toolchains
          ln -sfn $GITHUB_WORKSPACE/toolchain $GITHUB_WORKSPACE/toolchains/clang

      - name: Clone Clean Kernel Source (konoha-kernel-gki)
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/onyx-oss/konoha-kernel-gki.git kernel-source

      - name: Sanitize Dangerous Hooks & Exploits
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          echo "[-] Neutralizing Baseband-guard hook completely..."
          mkdir -p Baseband-guard
          cat << 'EOF' > Baseband-guard/setup.sh
          #!/bin/sh
          exit 0
          EOF
          chmod +x Baseband-guard/setup.sh
          sed -i 's|.*Baseband-guard.*setup.sh.*||g' build.sh || true

          echo "[-] Disabling dangerous GPU and Live Patch exploits..."
          sed -i 's/CONFIG_KGSL_EXPLOIT=y/# CONFIG_KGSL_EXPLOIT is not set/g' arch/arm64/configs/konoha_defconfig || true

          # Fix ksu_susfs_fixup.sh conflicting types bug for KernelSU-Next
          sed -i 's/int ksu_handle_execveat_sucompat(int \*fd/long ksu_handle_execveat_sucompat(const char __user \*\*filename_user, int orig_nr, struct pt_regs \*regs);\nint _disabled_ksu_handle_execveat_sucompat(int \*fd/g' ksu_susfs_fixup.sh

      - name: Apply Kali NetHunter Packet Injection & Wireless Configs
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          echo "[-] Enabling NetHunter USB HID & Wireless injection in konoha_defconfig..."
          
          cat << 'EOF' >> arch/arm64/configs/konoha_defconfig
          # Kali NetHunter - Rohit Sharma Edition Configurations
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_MAC80211_RC_MINSTREL=y
          CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_RTL8XXXU=m
          CONFIG_RTL8XXXU_UNTESTED=y
          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_ATH9K_HW=m
          CONFIG_ATH9K_COMMON=m
          CONFIG_ATH9K_HTC=m
          CONFIG_ATH9K_HTC_DEBUGFS=y
          CONFIG_WLAN_VENDOR_RALINK=y
          CONFIG_RT2X00=m
          CONFIG_RT2800USB=m
          CONFIG_RT2800USB_RT3573=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_RT2800USB_RT55XX=y
          CONFIG_RT2800USB_UNKNOWN=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_F_HID=y
          EOF

      - name: Add Out-Of-Tree RTL8821AU Driver (Archer T2U Plus)
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          echo "[-] Cloning official morrownr/8821au-20210708 for Archer T2U Plus..."
          git clone --depth=1 https://github.com/morrownr/8821au-20210708.git drivers/net/wireless/realtek/rtl8821au
          if [ -d "drivers/net/wireless/realtek/rtl8821au" ]; then
            echo "obj-\$(CONFIG_RTL8821AU) += rtl8821au/" >> drivers/net/wireless/realtek/Makefile
            echo 'source "drivers/net/wireless/realtek/rtl8821au/Kconfig"' >> drivers/net/wireless/realtek/Kconfig
            echo "CONFIG_RTL8821AU=m" >> arch/arm64/configs/konoha_defconfig
          fi

      - name: Compile NetHunter Kernel via Native build.sh
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export CLANG_PATH="$GITHUB_WORKSPACE/toolchain"
          export CLANG_DIR="$GITHUB_WORKSPACE/toolchain"

          chmod +x build.sh
          chmod +x ksu_susfs_fixup.sh 2>/dev/null || true

          ./build.sh \
            hz=250 \
            variant=susfs \
            root=ksu-next \
            hardened=off \
            bypasscharging=off \
            droidspaces=off \
            lto=thin \
            kgsl_exploit=off \
            wifi_exploit=off \
            data_exploit=off \
            kernel_name="-NetHunter-Rohit-Edition"

      - name: Package AnyKernel3 - Rohit Sharma NetHunter Edition
        run: |
          cd $GITHUB_WORKSPACE
          BUILT_ZIP="${ZIP_PATH:-$(find $GITHUB_WORKSPACE/kernel-source -maxdepth 1 -name '*.zip' | head -n 1)}"
          echo "Built ZIP: $BUILT_ZIP"

          mkdir -p repack
          cd repack
          unzip -q "$BUILT_ZIP"

          # Harvest built wireless modules
          mkdir -p modules
          find "$GITHUB_WORKSPACE/kernel-source/out" -name "*.ko" -exec cp -v {} modules/ \; 2>/dev/null || true
          $GITHUB_WORKSPACE/toolchain/bin/llvm-strip --strip-debug modules/*.ko 2>/dev/null || true

          # Download and bundle required WiFi Firmware
          mkdir -p firmware/rtlwifi
          mkdir -p firmware/ath9k_htc
          wget -q -O firmware/rtlwifi/rtl8188eufw.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtlwifi/rtl8188eufw.bin || true
          wget -q -O firmware/htc_9271.fw https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/htc_9271.fw || true

          # Customize Rohit Sharma NetHunter Banner
          cat << 'EOF' > anykernel.sh
          properties() { '
          kernel.string=Kali NetHunter Kernel - Rohit Sharma Edition (POCO F7 / Onyx)
          do.devicecheck=0
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          '; }

          # Shell Attributes
          . tools/ak3-core.sh;

          ui_print " ";
          ui_print "===========================================";
          ui_print "  KALI NETHUNTER KERNEL - ROHIT SHARMA     ";
          ui_print "  Device: POCO F7 / Onyx (SM8735)          ";
          ui_print "  Features: Packet Injection + HID + WiFi  ";
          ui_print "  Universal GKI: Android 15 / 16 / 17      ";
          ui_print "===========================================";
          ui_print " ";

          # Dump and flash boot
          split_boot;
          flash_boot;

          # Install WiFi Modules & Firmwares cleanly
          if [ -d "$home/modules" ]; then
            ui_print "- Installing NetHunter WiFi drivers...";
            cp -rf $home/modules/* /vendor/lib/modules/ 2>/dev/null || true
          fi

          if [ -d "$home/firmware" ]; then
            ui_print "- Installing wireless firmwares...";
            mkdir -p /vendor/firmware/rtlwifi /odm/firmware 2>/dev/null || true
            cp -rf $home/firmware/* /vendor/firmware/ 2>/dev/null || true
          fi

          ui_print " ";
          ui_print "-> NetHunter Kernel Successfully Installed!";
          ui_print "-> Flash Complete by Rohit Sharma!";
          EOF

          FINAL_ZIP="NetHunter-Kernel-POCO-F7-Onyx-Rohit-Edition.zip"
          zip -r9 "$FINAL_ZIP" * -x "*.zip"
          mv "$FINAL_ZIP" $GITHUB_WORKSPACE/

      - name: Upload Flashable NetHunter Kernel Release
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-POCO-F7-Onyx-Rohit-Edition
          path: ${{ github.workspace }}/NetHunter-Kernel-POCO-F7-Onyx-Rohit-Edition.zip
          retention-days: 14
