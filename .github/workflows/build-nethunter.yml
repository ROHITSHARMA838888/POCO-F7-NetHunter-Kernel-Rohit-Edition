name: Build Rohit Sharma NetHunter Kernel (POCO F7)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build NetHunter Kernel (Rohit Sharma Edition)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev git ccache curl wget zip python3 clang lld llvm \
            libarchive-tools cpio dwarves kmod rsync

      - name: Setup Toolchain (AOSP Clang r522817)
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -zxf clang-r522817.tar.gz
          rm -f clang-r522817.tar.gz
          mkdir -p $GITHUB_WORKSPACE/toolchains
          ln -sfn $GITHUB_WORKSPACE/toolchain $GITHUB_WORKSPACE/toolchains/clang

      - name: Clone Clean Official Kernel Source (konoha-kernel-gki main branch)
        run: |
          cd $GITHUB_WORKSPACE
          echo "[-] Cloning official clean konoha-kernel-gki main branch (POCO F7 / Onyx)..."
          git clone --depth=1 -b main https://github.com/onyx-oss/konoha-kernel-gki.git kernel-source

      - name: Sanitize Dangerous Hooks & Configure KernelSU-Next
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          echo "[-] Neutralizing Baseband-guard hook completely..."
          mkdir -p Baseband-guard
          cat << 'EOF' > Baseband-guard/setup.sh
          #!/bin/sh
          exit 0
          EOF
          chmod +x Baseband-guard/setup.sh
          sed -i 's|.*Baseband-guard.*setup.sh.*||g' build.sh || true

          # Ensure USB HID (BadUSB) & Wireless Subsystem are explicitly set in defconfig
          echo "[-] Ensuring NetHunter USB HID BadUSB and Wireless configs are active..."
          sed -i 's/.*CONFIG_USB_F_HID.*/CONFIG_USB_F_HID=y/' arch/arm64/configs/konoha_defconfig || true
          sed -i 's/.*CONFIG_USB_CONFIGFS_F_HID.*/CONFIG_USB_CONFIGFS_F_HID=y/' arch/arm64/configs/konoha_defconfig || true
          grep -q "CONFIG_USB_F_HID=y" arch/arm64/configs/konoha_defconfig || echo "CONFIG_USB_F_HID=y" >> arch/arm64/configs/konoha_defconfig
          grep -q "CONFIG_USB_CONFIGFS_F_HID=y" arch/arm64/configs/konoha_defconfig || echo "CONFIG_USB_CONFIGFS_F_HID=y" >> arch/arm64/configs/konoha_defconfig

          # Enable cfg80211, mac80211, and in-tree rtl8xxxu (natively supports 2357:010c)
          cat << 'EOF' >> arch/arm64/configs/konoha_defconfig
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_RTL8XXXU=m
          CONFIG_RTL8XXXU_UNTESTED=y
          EOF

      - name: Compile NetHunter Kernel via Native build.sh
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export CLANG_PATH="$GITHUB_WORKSPACE/toolchain"
          export CLANG_DIR="$GITHUB_WORKSPACE/toolchain"

          chmod +x build.sh
          chmod +x ksu_susfs_fixup.sh 2>/dev/null || true

          ./build.sh \
            hz=250 \
            variant=root \
            root=ksu-next \
            hardened=off \
            bypasscharging=off \
            droidspaces=off \
            lto=thin \
            kgsl_exploit=off \
            wifi_exploit=off \
            data_exploit=off \
            kernel_name="-NetHunter-Rohit-Edition"

      - name: Build RTL8188EUS Driver (TP-Link TL-WN722N v2/v3 - 2357:010c)
        run: |
          cd $GITHUB_WORKSPACE
          echo "[-] Cloning gglluukk/rtl8188eus for TP-Link TL-WN722N v2/v3 (2357:010c)..."
          git clone --depth=1 https://github.com/gglluukk/rtl8188eus.git rtl8188eus
          cd rtl8188eus
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile || true
          sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/g' Makefile || true
          sed -i 's/obj-\$(CONFIG_RTL8188EU)/obj-m/g' Makefile || true
          sed -i 's/-Wno-restrict//g' Makefile || true
          sed -i 's/-Wno-vla-larger-than//g' Makefile || true
          sed -i 's/-Werror//g' Makefile || true
          sed -i '1s/^/ccflags-y += -Wno-unknown-warning-option -Wno-error\n/' Makefile || true
          
          # Fix Linux 6.6 VFS namespace import
          echo 'MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);' >> os_dep/osdep_service.c

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          make -C $GITHUB_WORKSPACE/kernel-source \
            O=$GITHUB_WORKSPACE/kernel-source/out \
            M=$PWD \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CONFIG_RTL8188EU=m \
            USER_EXTRA_CFLAGS="-Wno-error -Wno-unknown-warning-option" \
            KCFLAGS="-Wno-error -Wno-unknown-warning-option" \
            KBUILD_MODPOST_WARN=1 \
            modules -j$(nproc)
          
          if [ -f "8188eu.ko" ]; then
            echo "[+] SUCCESS: 8188eu.ko was built successfully!"
            ls -la 8188eu.ko
          else
            echo "[-] ERROR: 8188eu.ko was not produced!"
            exit 1
          fi

      - name: Package AnyKernel3 - Rohit Sharma NetHunter Edition
        run: |
          cd $GITHUB_WORKSPACE
          BUILT_ZIP="${ZIP_PATH:-$(find $GITHUB_WORKSPACE/kernel-source -maxdepth 1 -name '*.zip' | head -n 1)}"
          echo "Built ZIP: $BUILT_ZIP"
          if [ -z "$BUILT_ZIP" ] || [ ! -f "$BUILT_ZIP" ]; then
            echo "[-] Error: Built kernel zip not found!"
            exit 1
          fi

          mkdir -p repack
          cd repack
          unzip -q "$BUILT_ZIP"

          # Harvest external dongle wireless modules (8188eu.ko + in-tree rtl8xxxu.ko)
          mkdir -p modules
          find "$GITHUB_WORKSPACE/rtl8188eus" -name "8188eu.ko" -exec cp -v {} modules/ \;
          find "$GITHUB_WORKSPACE/kernel-source/out" -name "rtl8xxxu.ko" -exec cp -v {} modules/ \; 2>/dev/null || true
          echo "[-] Harvested external modules:"
          ls -la modules/

          if [ ! -f "modules/8188eu.ko" ]; then
            echo "[-] CRITICAL AUDIT FAILURE: modules/8188eu.ko is missing!"
            exit 1
          fi

          $GITHUB_WORKSPACE/toolchain/bin/llvm-strip --strip-debug modules/*.ko 2>/dev/null || true

          # Download and bundle required WiFi Firmware for Realtek 8188
          mkdir -p firmware/rtlwifi
          wget -q -O firmware/rtlwifi/rtl8188eufw.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtlwifi/rtl8188eufw.bin || true

          # Generate clean anykernel.sh for POCO F7 via standalone Python script
          python3 $GITHUB_WORKSPACE/scripts/generate_anykernel.py anykernel.sh

          FINAL_ZIP="NetHunter-Kernel-POCO-F7-Onyx-Rohit-Edition.zip"
          zip -r9 "$FINAL_ZIP" * -x "*.zip"
          mv "$FINAL_ZIP" $GITHUB_WORKSPACE/

      - name: Upload Flashable NetHunter Kernel Release
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-POCO-F7-Onyx-Rohit-Edition
          path: ${{ github.workspace }}/NetHunter-Kernel-POCO-F7-Onyx-Rohit-Edition.zip
          retention-days: 14
